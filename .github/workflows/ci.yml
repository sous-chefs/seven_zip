---
name: ci

"on":
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@9.0.1
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write

  integration:
    needs: "lint-unit"

    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        os:
          - "windows-latest"
        suite:
          - "default"
          - "remove"
      fail-fast: false
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Chef
        uses: sous-chefs/.github/.github/actions/install-workstation@9.0.1
      - name: Resolve local policy
        run: chef install Policyfile.rb
      - name: Install before removal acceptance
        if: matrix.suite == 'remove'
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.exec.yml
        run: kitchen converge default-windows-latest
      - name: test-kitchen
        if: matrix.suite == 'default'
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.exec.yml
        run: kitchen test ${{ matrix.suite }}-${{ matrix.os }} --destroy=always
      - name: Remove twice and verify
        if: matrix.suite == 'remove'
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.exec.yml
          SEVEN_ZIP_RUN_LIST: remove
          SEVEN_ZIP_VERIFY_PROFILE: remove
        run: |
          kitchen converge default-windows-latest
          kitchen verify default-windows-latest --test-base-path=test/integration/remove
      - name: Clean removal instance
        if: always() && matrix.suite == 'remove'
        env:
          KITCHEN_LOCAL_YAML: kitchen.exec.yml
        run: kitchen destroy default-windows-latest
