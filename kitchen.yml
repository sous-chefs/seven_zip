---
driver:
  name: vagrant
  gui: false
  customize:
    memory: 4096

provisioner:
  name: chef_zero
  product_name: chef
  policyfile: Policyfile.rb
  named_run_list: <%= ENV.fetch('SEVEN_ZIP_RUN_LIST', 'default') %>
  enforce_idempotency: true
  multiple_converge: 2
  deprecations_as_errors: true

transport:
  name: winrm
  elevated: true

verifier:
  name: inspec
  inspec_tests:
    - test/integration/<%= ENV.fetch('SEVEN_ZIP_VERIFY_PROFILE', 'default') %>

platforms:
  - name: windows-2019
    driver_config:
      box: tas50/windows_2019

suites:
  - name: default
  - name: remove
    provisioner:
      named_run_list: remove
    verifier:
      inspec_tests:
        - test/integration/remove
